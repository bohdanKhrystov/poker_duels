<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="One duel coin">
  <!-- Poker Duels, the duel coin. Steel, per the vision (docs/vision.md): it counts duels won.
       Colors are literal because SVG assets travel without the CSS custom-property scope;
       they mirror the pd-coin (#9fb2c4), pd-coin-deep (#64788c) and pd-bg (#131211) tokens.
       (Token names are spelled without their leading dashes here: XML forbids them in comments.) -->
  <defs>
    <radialGradient id="steel" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#b8c6d6"/>
      <stop offset="0.55" stop-color="#9fb2c4"/>
      <stop offset="1" stop-color="#64788c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2cfdd"/>
      <stop offset="1" stop-color="#556879"/>
    </linearGradient>
  </defs>

  <!-- rim and field -->
  <circle cx="48" cy="48" r="46" fill="url(#rim)"/>
  <circle cx="48" cy="48" r="41.5" fill="url(#steel)"/>
  <circle cx="48" cy="48" r="41.5" fill="none" stroke="#131211" stroke-opacity="0.18" stroke-width="1"/>

  <!-- crossed rapiers: blade, simple cross-guard, pommel — geometry, not illustration -->
  <g stroke-linecap="round">
    <g transform="rotate(45 48 48)">
      <rect x="46.6" y="16" width="2.8" height="52" rx="1.4" fill="#3d4e5e"/>
      <rect x="40" y="60.4" width="16" height="2.8" rx="1.4" fill="#3d4e5e"/>
      <circle cx="48" cy="68.5" r="2.6" fill="#3d4e5e"/>
    </g>
    <g transform="rotate(-45 48 48)">
      <rect x="46.6" y="16" width="2.8" height="52" rx="1.4" fill="#2c3a47"/>
      <rect x="40" y="60.4" width="16" height="2.8" rx="1.4" fill="#2c3a47"/>
      <circle cx="48" cy="68.5" r="2.6" fill="#2c3a47"/>
    </g>
  </g>

  <!-- the count: one duel won -->
  <g transform="translate(48 51)">
    <circle cx="0" cy="-3" r="15.5" fill="#a9bbcc"/>
    <circle cx="0" cy="-3" r="15.5" fill="none" stroke="#131211" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M -2.6 -10.5 L 1.6 -12.5 L 1.6 6 L -2.9 6 L -2.9 2.6 L -2.6 -6.2 L -5 -5 L -5 -8.6 Z"
          fill="#131211" fill-opacity="0.82"/>
  </g>
</svg>
