<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 24" role="img" aria-label="The four suits">
  <!-- Poker Duels, the suit glyphs. One drawn set so every platform shows the same pips,
       instead of each OS font's own. Each symbol fills a 24x24 box between cap-line y=1.5
       and baseline y=22.5; color comes from fill at the use site: pd-suit-black (#26231f)
       for spades and clubs, pd-suit-red (#bf3b30) for hearts and diamonds. Ids carry the
       pd- prefix because ids resolve document-wide once inlined. (Token names lack their
       leading dashes: XML comment rule.) -->
  <defs>
    <symbol id="pd-spade" viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 1.5 C 9.2 7, 3.5 9.6, 3.5 13.6 C 3.5 16.6, 6.6 18.2, 9.4 16.6
               C 9 19, 8 20.4, 6.8 22.5 L 17.2 22.5 C 16 20.4, 15 19, 14.6 16.6
               C 17.4 18.2, 20.5 16.6, 20.5 13.6 C 20.5 9.6, 14.8 7, 12 1.5 Z"/>
    </symbol>
    <symbol id="pd-heart" viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 22.5 C 5.4 15.8, 2 11.7, 2 7.6 C 2 4.2, 4.4 1.5, 7.2 1.5
               C 9.2 1.5, 11 2.9, 12 5.1 C 13 2.9, 14.8 1.5, 16.8 1.5
               C 19.6 1.5, 22 4.2, 22 7.6 C 22 11.7, 18.6 15.8, 12 22.5 Z"/>
    </symbol>
    <symbol id="pd-diamond" viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 1.5 C 14.2 5.6, 16.8 8.9, 20 12 C 16.8 15.1, 14.2 18.4, 12 22.5
               C 9.8 18.4, 7.2 15.1, 4 12 C 7.2 8.9, 9.8 5.6, 12 1.5 Z"/>
    </symbol>
    <symbol id="pd-club" viewBox="0 0 24 24" width="24" height="24">
      <circle cx="12" cy="6.8" r="4.6"/>
      <circle cx="7.5" cy="13.2" r="4.6"/>
      <circle cx="16.5" cy="13.2" r="4.6"/>
      <path d="M10.4 10.5 C 10.8 16, 9.9 20.3, 8.6 22.5 L 15.4 22.5
               C 14.1 20.3, 13.2 16, 13.6 10.5 Z"/>
    </symbol>
  </defs>
  <use href="#pd-spade" width="24" height="24" x="0" fill="#26231f"/>
  <use href="#pd-heart" width="24" height="24" x="32" fill="#bf3b30"/>
  <use href="#pd-diamond" width="24" height="24" x="64" fill="#bf3b30"/>
  <use href="#pd-club" width="24" height="24" x="96" fill="#26231f"/>
</svg>
