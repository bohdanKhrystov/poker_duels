<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 24" role="img" aria-label="The four suits">
  <!-- Poker Duels, the suit glyphs. One drawn set so every platform shows the same pips,
       instead of each OS font's own. Each symbol fills a 24x24 box; color comes from fill
       at the use site: pd-suit-black (#26231f) for spades and clubs, pd-suit-red (#bf3b30)
       for hearts and diamonds. (Token names lack their leading dashes: XML comment rule.) -->
  <defs>
    <symbol id="spade" viewBox="0 0 24 24">
      <path d="M12 1.5 C 9.2 7, 3.5 9.6, 3.5 13.6 C 3.5 16.6, 6.6 18.2, 9.4 16.6
               C 9 19, 8 20.4, 6.8 22.5 L 17.2 22.5 C 16 20.4, 15 19, 14.6 16.6
               C 17.4 18.2, 20.5 16.6, 20.5 13.6 C 20.5 9.6, 14.8 7, 12 1.5 Z"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 24 24">
      <path d="M12 21.5 C 5.4 15.6, 2 12, 2 8.4 C 2 5.4, 4.4 3, 7.2 3
               C 9.2 3, 11 4.2, 12 6.2 C 13 4.2, 14.8 3, 16.8 3
               C 19.6 3, 22 5.4, 22 8.4 C 22 12, 18.6 15.6, 12 21.5 Z"/>
    </symbol>
    <symbol id="diamond" viewBox="0 0 24 24">
      <path d="M12 1.5 C 14.2 5.6, 16.8 8.9, 20 12 C 16.8 15.1, 14.2 18.4, 12 22.5
               C 9.8 18.4, 7.2 15.1, 4 12 C 7.2 8.9, 9.8 5.6, 12 1.5 Z"/>
    </symbol>
    <symbol id="club" viewBox="0 0 24 24">
      <circle cx="12" cy="6.8" r="4.6"/>
      <circle cx="6.6" cy="13.4" r="4.6"/>
      <circle cx="17.4" cy="13.4" r="4.6"/>
      <path d="M10.4 14.5 C 10.8 18, 9.9 20.3, 8.6 22.5 L 15.4 22.5
               C 14.1 20.3, 13.2 18, 13.6 14.5 Z"/>
    </symbol>
  </defs>
  <use href="#spade" width="24" height="24" x="0" fill="#26231f"/>
  <use href="#heart" width="24" height="24" x="32" fill="#bf3b30"/>
  <use href="#diamond" width="24" height="24" x="64" fill="#bf3b30"/>
  <use href="#club" width="24" height="24" x="96" fill="#26231f"/>
</svg>
