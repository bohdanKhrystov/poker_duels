name: build

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/gradle-build-action@v3

      - name: Run ./gradlew check
        run: ./gradlew check -PrequireDocker=true

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web-client/.nvmrc
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck, lint, format and test
        run: npm run check

      - name: Production build
        run: npm run build
